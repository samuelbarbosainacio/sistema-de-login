<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="container">
        <div class="login-card">
            <div class="header">
                <img src="https://tse2.mm.bing.net/th/id/OIP.PBvNGgUOQE2NLr8KnneGvAHaEo?r=0&rs=1&pid=ImgDetMain&o=7&rm=3" 
                     alt="Logo" class="logo">
                <h1>Recuperar Senha</h1>
                <p class="subtitle">Digite seu usuário e enviaremos um link de recuperação.</p>
            </div>

            <form action="/forgot-password" method="post">
                <div class="input-group">
                    <label for="username">Usuário ou E-mail</label>
                    <input type="text" id="username" name="username" required autocomplete="username">
                </div>

                <button type="submit" class="btn-login">Enviar Link de Recuperação</button>
            </form>

            <div class="footer-links">
                <a href="login.html" class="back">← Voltar para o Login</a>
            </div>
        </div>
    </div>
</body>
</html>
