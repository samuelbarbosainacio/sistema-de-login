<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificação em Duas Etapas</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="container">
        <div class="login-card">
            <div class="header">
                <img src="https://i.pinimg.com/736x/d9/d8/8e/d9d88e3d1f74e2b8ced3df051cecb81d.jpg" 
                     alt="Logo" class="logo">
                <h1>Verificação em Duas Etapas</h1>
                <p class="subtitle">Digite o código de 6 dígitos enviado para seu e-mail ou celular.</p>
                <p style="color: #ffd700; font-size: 0.9rem; margin-top: 10px;">
                    <strong>Código para teste: 123456</strong>
                </p>
            </div>

            <form id="verifyForm">
                <div class="input-group">
                    <label for="code">Código de verificação</label>
                    <input type="text" id="code" maxlength="6" 
                           placeholder="000000" 
                           style="text-align: center; font-size: 1.9rem; letter-spacing: 12px; font-weight: 600;" 
                           required autofocus>
                </div>

                <button type="button" class="btn-login" onclick="confirmarCodigo()">Confirmar Código</button>
            </form>

            <div class="footer-links">
                <a href="#" id="resend" class="forgot">Reenviar código</a>
                <a href="login.html" class="back">← Voltar ao Login</a>
            </div>
        </div>
    </div>

    <script>
        const CODIGO_CORRETO = "123456";   // ← Código específico para teste

        function confirmarCodigo() {
            const code = document.getElementById('code').value.trim();

            if (code === CODIGO_CORRETO) {
                alert("✅ Verificação realizada com sucesso!\n\nBem-vindo ao sistema.");
                window.location.href = "paginainicial.html";
            } 
            else if (code.length === 6) {
                alert("❌ Código inválido!\n\nO código correto para teste é: 123456");
            } 
            else {
                alert("Código inválido. Digite 6 números.");
            }
        }

        // Reenviar código
        document.getElementById('resend').addEventListener('click', function(e) {
            e.preventDefault();
            alert("✅ Código reenviado!\n\nCódigo para teste: 123456");
        });
    </script>
</body>
</html>
