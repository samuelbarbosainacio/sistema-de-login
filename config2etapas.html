<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurar 2FA</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="container">
        <div class="login-card">
            <div class="header">
                <img src="https://i.pinimg.com/736x/d9/d8/8e/d9d88e3d1f74e2b8ced3df051cecb81d.jpg" 
                     alt="Logo" class="logo">
                <h1>Verificação em Duas Etapas</h1>
                <p class="subtitle">Escolha como deseja receber o código</p>
            </div>

            <form id="configForm">
                <div class="input-group">
                    <label for="method">Método de verificação</label>
                    <select id="method" required>
                        <option value="">Selecione...</option>
                        <option value="email">📧 E-mail (Gmail)</option>
                        <option value="sms">📱 SMS (Celular)</option>
                    </select>
                </div>

                <div id="email-field" class="input-group hidden">
                    <label for="email">Seu E-mail</label>
                    <input type="email" id="email" placeholder="seuemail@gmail.com">
                </div>

                <div id="phone-field" class="input-group hidden">
                    <label for="phone">Seu Celular</label>
                    <input type="tel" id="phone" placeholder="+55 (XX) XXXXX-XXXX">
                </div>

                <button type="button" class="btn-login" onclick="ativar2FA()">Ativar Verificação</button>
            </form>

            <div class="footer-links">
                <a href="login.html" class="back">← Voltar</a>
            </div>
        </div>
    </div>

    <script>
        const method = document.getElementById('method');
        const emailField = document.getElementById('email-field');
        const phoneField = document.getElementById('phone-field');

        method.addEventListener('change', () => {
            emailField.classList.add('hidden');
            phoneField.classList.add('hidden');
            if (method.value === 'email') emailField.classList.remove('hidden');
            if (method.value === 'sms') phoneField.classList.remove('hidden');
        });

        function ativar2FA() {
            const selectedMethod = method.value;
            
            if (!selectedMethod) {
                alert("Por favor, selecione um método de verificação.");
                return;
            }

            alert(`✅ Verificação em Duas Etapas ativada com sucesso via ${selectedMethod.toUpperCase()}!`);
            window.location.href = "paginainicial.html";
        }
    </script>
</body>
</html>
